<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>设备维保工作台 · 前端方案选择</title>
  <link rel="stylesheet" href="picker.css">
  <link rel="stylesheet" href="shared.css">
  <style>html,body{margin:0;min-height:100%;}#stage{min-height:100vh;}#stage:empty{background:#e9edf0;}</style>
  <script type="module" src="harness.js"></script>
</head>
<body>
  <main id="stage" aria-live="polite"></main>
  <nav class="proto-picker" aria-label="Prototype variants">
    <span class="proto-picker-highlight" aria-hidden="true"></span>
    <button class="proto-picker-item" data-active aria-current="true">控制塔</button>
    <button class="proto-picker-item">工作日</button>
    <button class="proto-picker-item">现场卡片</button>
    <span class="proto-picker-divider" aria-hidden="true"></span>
    <button class="proto-picker-item proto-picker-replay" aria-label="Replay animation (R)">↻</button>
  </nav>
</body>
</html>
