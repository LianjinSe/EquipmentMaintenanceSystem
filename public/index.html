<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>设备维保 · 工作日</title>
  <link rel="stylesheet" href="styles.css">
  <script type="module" src="app.js"></script>
</head>
<body class="quiet">
  <div class="quiet-shell">
    <header class="quiet-top">
      <a class="quiet-brand" href="#dashboard"><span class="quiet-brand-mark">维</span><span><strong>设备维保</strong><small>THE WORKBENCH</small></span></a>
      <nav class="quiet-nav" aria-label="主导航">
        <a href="#dashboard" data-view="dashboard">概览</a>
        <a href="#orders" data-view="orders">维修工单</a>
        <a href="#tasks" data-view="tasks">维保任务</a>
        <a href="#devices" data-view="devices">设备台账</a>
        <a href="#plans" data-view="plans">周期计划</a>
        <a href="#capabilities" data-view="capabilities">接口与进展</a>
      </nav>
      <div class="quiet-top-right">
        <label class="actor-label" for="actor">演示角色</label>
        <select id="actor" aria-label="切换演示角色"></select>
        <button id="messages-button" type="button" aria-label="站内消息">◌<em id="unread-count">0</em></button>
      </div>
    </header>
    <main id="content" class="quiet-main" tabindex="-1" aria-busy="true"><div class="loading">正在加载本地演示数据…</div></main>
    <footer class="page-footer">本地流程演示 · 当前页面使用演示角色，企业认证与数据隔离待接续。</footer>
  </div>
  <dialog id="dialog" aria-labelledby="dialog-title">
    <div class="dialog-head"><h2 id="dialog-title"></h2><button id="close-dialog" class="icon-button" aria-label="关闭弹窗">×</button></div>
    <div id="dialog-body"></div>
  </dialog>
  <div id="toast" role="status" aria-live="polite" hidden></div>
</body>
</html>
